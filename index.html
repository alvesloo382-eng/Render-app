<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RENDER — Onde a química começa</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:20px 15px 90px;
    background:
        radial-gradient(circle at top,#24153b 0%,#0d1019 38%,#080b12 100%);
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.logo{
    text-align:center;
    padding:35px 10px 25px;
}

.logo h1{
    font-size:42px;
    letter-spacing:5px;
    background:linear-gradient(90deg,#ff4acb,#8c5cff);
    -webkit-background-clip:text;
    color:transparent;
}

.logo p{
    margin-top:8px;
    color:#aaa;
}

.card{
    background:#151925;
    border:1px solid #303749;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.center{
    text-align:center;
}

.muted{
    color:#999;
}

input,
select{
    width:100%;
    padding:14px;
    margin:7px 0;
    border-radius:12px;
    border:1px solid #3a4050;
    background:#0d111a;
    color:#fff;
    outline:none;
}

input:focus,
select:focus{
    border-color:#b75cff;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 16px;
    color:#fff;
}

.primary{
    width:100%;
    background:linear-gradient(90deg,#ff4acb,#8355ff);
    font-weight:bold;
}

.secondary{
    background:#282e3c;
    border:1px solid #3c4354;
}

.secondary:hover{
    background:#343b4d;
}

.small{
    padding:9px 12px;
    font-size:13px;
}

.success{
    background:#19a85b;
}

.danger{
    background:#c83b52;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0 20px;
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:54px;
    height:54px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ff4bcf,#6e50ff);
    font-size:26px;
}

.profile-info{
    flex:1;
}

.online{
    width:9px;
    height:9px;
    background:#4dff83;
    border-radius:50%;
    display:inline-block;
}

.balance{
    display:flex;
    gap:10px;
}

.balance .wallet{
    flex:1;
    background:#171c29;
    border-radius:16px;
    padding:15px;
    border:1px solid #303749;
}

.wallet strong{
    display:block;
    font-size:25px;
    margin-top:6px;
}

.coin{
    color:#ffd34d;
}

.bean{
    color:#6dff9c;
}

.person{
    display:flex;
    gap:13px;
    align-items:center;
}

.person .avatar{
    flex-shrink:0;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    background:#35244c;
    color:#d99cff;
    font-size:11px;
    margin-top:5px;
}

.price{
    font-size:20px;
    font-weight:bold;
    margin:9px 0;
}

.package{
    border:1px solid #343b4d;
    background:#151a27;
    padding:16px;
    border-radius:16px;
    margin-bottom:10px;
}

.package.recommended{
    border-color:#bc59ff;
}

.package button{
    margin-top:10px;
    width:100%;
}

.chat{
    background:#0d111a;
    border-radius:15px;
    padding:15px;
    height:340px;
    overflow-y:auto;
    margin:15px 0;
}

.msg{
    padding:10px 13px;
    border-radius:15px;
    margin:8px 0;
    max-width:82%;
}

.msg.other{
    background:#222837;
}

.msg.me{
    background:#7139a5;
    margin-left:auto;
}

.notice{
    padding:12px;
    background:#211d2c;
    border:1px solid #403653;
    border-radius:12px;
    margin-bottom:14px;
    color:#ddd;
}

.stat{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #292e3b;
}

.stat:last-child{
    border-bottom:0;
}

.person-card{
    background:#151925;
    border:1px solid #303749;
    border-radius:18px;
    padding:16px;
    margin-bottom:12px;
}

.person-card button{
    margin-top:10px;
    width:100%;
}

.tabs{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(520px,100%);
    background:#10131d;
    border-top:1px solid #303544;
    display:flex;
    z-index:20;
}

.tabs button{
    flex:1;
    background:none;
    color:#9298a8;
    border-radius:0;
    padding:14px 5px;
    font-size:12px;
}

.tabs button.active{
    color:#fff;
    background:#1c2130;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(480px,100%);
    max-height:90vh;
    overflow:auto;
    background:#151925;
    border:1px solid #3c4254;
    border-radius:20px;
    padding:20px;
}

.close{
    float:right;
    background:#282e3c;
    width:38px;
    height:38px;
    padding:0;
    font-size:24px;
}

.call{
    text-align:center;
    padding:35px 15px;
}

.call .avatar{
    width:100px;
    height:100px;
    margin:0 auto 20px;
    font-size:45px;
}

.timer{
    font-size:40px;
    margin:15px 0;
}

hr{
    border:0;
    border-top:1px solid #303544;
    margin:18px 0;
}

.empty{
    text-align:center;
    padding:45px 15px;
    color:#888;
}

@media(max-width:360px){
    .logo h1{
        font-size:34px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= LOGIN ================= -->

<section id="login" class="screen active">

    <div class="logo">
        <h1>RENDER</h1>
        <p>Onde a química começa.</p>
    </div>

    <div class="card">

        <h2>Entrar</h2>

        <p class="muted" style="margin:8px 0 15px;">
            Entre para continuar.
        </p>

        <input
            id="loginEmail"
            type="email"
            placeholder="Seu e-mail"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Sua senha"
        >

        <button
            class="primary"
            onclick="login()"
        >
            Entrar
        </button>

        <br><br>

        <button
            class="secondary"
            style="width:100%;"
            onclick="show('register')"
        >
            Criar minha conta
        </button>

    </div>

    <div class="card center">

        <p class="muted">
            O RENDER conecta pessoas para conversas,
            mensagens e chamadas.
        </p>

    </div>

</section>


<!-- ================= CADASTRO ================= -->

<section id="register" class="screen">

    <div class="topbar">

        <button
            class="secondary small"
            onclick="show('login')"
        >
            ← Voltar
        </button>

    </div>

    <div class="logo">

        <h1>RENDER</h1>

        <p>Crie sua conta</p>

    </div>

    <div class="card">

        <h2 style="margin-bottom:15px;">
            Criar conta
        </h2>

        <input
            id="regName"
            type="text"
            placeholder="Seu nome"
        >

        <input
            id="regEmail"
            type="email"
            placeholder="Seu e-mail"
        >

        <input
            id="regPassword"
            type="password"
            placeholder="Crie uma senha"
        >

        <label
            class="muted"
            style="display:block;margin:10px 0 5px;"
        >
            Você é:
        </label>

        <select id="regGender">

            <option value="male">
                Homem
            </option>

            <option value="female">
                Mulher
            </option>

        </select>

        <input
            id="regAge"
            type="number"
            placeholder="Idade"
            min="18"
            max="120"
        >

        <button
            class="primary"
            onclick="register()"
        >
            Criar conta
        </button>

    </div>

    <div class="notice">

        🔞 O RENDER é destinado exclusivamente
        a maiores de 18 anos.

    </div>

</section>


<!-- ================= HOME ================= -->

<section id="home" class="screen">

    <div class="topbar">

        <div class="profile">

            <div
                class="avatar"
                id="homeAvatar"
            >
                👤
            </div>

            <div class="profile-info">

                <strong id="homeName">
                    Usuário
                </strong>

                <div>
                    <span class="online"></span>
                    online
                </div>

            </div>

        </div>

        <button
            class="secondary small"
            onclick="logout()"
        >
            Sair
        </button>

    </div>


    <div class="balance">

        <div class="wallet">

            🪙 Moedas

            <strong
                class="coin"
                id="coinBalance"
            >
                0
            </strong>

        </div>

        <div class="wallet">

            🌱 Feijões
